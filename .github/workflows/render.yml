name: Render Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.57'

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("tidyverse", "knitr", "rmarkdown", "ggplot2", "flextable", "officer","huxtable","readxl","haven","e1071","corrplot","stringr","ggrepel"))'

      - name: Render site
        run: quarto render

      - name: Commit rendered files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-render Quarto site [skip ci]"
          file_pattern: "_freeze/* _site/*"

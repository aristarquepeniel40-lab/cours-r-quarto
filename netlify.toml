[build]
  command = "wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb && dpkg -x quarto-${QUARTO_VERSION}-linux-amd64.deb quarto-install && export PATH=$PATH:$(pwd)/quarto-install/usr/local/bin && quarto render"
  publish = "_site"

[build.environment]
  QUARTO_VERSION = "1.5.57"
